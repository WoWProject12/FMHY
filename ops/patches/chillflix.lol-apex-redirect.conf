# Apex host: redirect HTML to www (SEO), but serve /api/* here so cross-origin
# playback from www does not hit a bare 301 without CORS headers.

server {
    # <<< cloudflare-only origin lockdown <<<
    include /etc/nginx/snippets/cloudflare-only.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chillflix.lol;

    ssl_certificate /etc/letsencrypt/live/chillflix.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chillflix.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # disabled — Vidy-only
    # include /etc/nginx/snippets/chillflix.lol-cinepro-proxy.conf;
    include /etc/nginx/snippets/chillflix-plausible.conf;

    # Auth must hit PHP newsite (role/isAdmin). Other /api stays on Next player.
    location = /api/auth/me {
        include /etc/nginx/snippets/movy-auth-me-guest-shortcircuit.conf;
        include /etc/nginx/snippets/chillflix.lol-toflix-fastcgi.conf;
    }
    location ^~ /api/auth/ {
        include /etc/nginx/snippets/chillflix.lol-toflix-fastcgi.conf;
    }
    location ^~ /api/notifications {
        include /etc/nginx/snippets/chillflix.lol-toflix-fastcgi.conf;
    }
    location ^~ /api/support {
        include /etc/nginx/snippets/chillflix.lol-toflix-fastcgi.conf;
    }
    # Live TV APIs run without Next basePath=/old
    location ^~ /api/iptv/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $chillflix_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/old$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $chillflix_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        return 301 https://www.chillflix.lol$request_uri;
    }
}

server {
    # <<< cloudflare-only origin lockdown <<<
    include /etc/nginx/snippets/cloudflare-only.conf;

    listen 80;
    listen [::]:80;
    server_name chillflix.lol;

    location ^~ /api/ {
        return 301 https://chillflix.lol$request_uri;
    }

    location ^~ /analytics {
        return 301 https://chillflix.lol$request_uri;
    }

    location / {
        return 301 https://www.chillflix.lol$request_uri;
    }
}
